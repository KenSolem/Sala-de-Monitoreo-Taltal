<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título generalizado -->
    <title>Sala de Monitoreo</title>

    <!-- BOOTSTRAP 5 CSS (Vía CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Estilo simple para asegurar que el iframe del reproductor ocupe buen espacio */
        .visor-tv {
            width: 100%;
            height: 75vh; /* Ocupa el 75% del alto de la pantalla */
            border: 2px solid #d35400; /* Borde naranjo para mantener el estilo original */
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            background-color: #141418;
        }
    </style>
</head>
<body class="bg-dark text-white">

    <!-- Barra de navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary bg-gradient shadow-sm mb-4">
        <div class="container-fluid">
            <!-- Nombre generalizado -->
            <a class="navbar-brand fw-bold" href="#">🚨 Sala de Monitoreo</a>
            <span class="navbar-text">
                Actualizado en tiempo real
            </span>
        </div>
    </nav>

    <!-- Contenedor principal Grid de Bootstrap -->
    <div class="container-fluid px-4">
        <div class="row g-4">
            
            <!-- COLUMNA IZQUIERDA: Transmisión Directa desde la web de Taltal TV (ocupa 8 de 12 espacios) -->
            <div class="col-lg-8">
                <!-- Aquí incrustamos la página de Taltal TV mediante un iframe -->
                <iframe src="https://www.taltaltv.net/data/iptv%20local.HTML" class="visor-tv" allowfullscreen></iframe>
            </div>

            <!-- COLUMNA DERECHA: Tarjetas de Información Adicional (ocupa 4 de 12 espacios) -->
            <div class="col-lg-4">
                
                <!-- Tarjeta 1: Cámaras de Paranal -->
                <div class="card bg-dark border-secondary mb-3 shadow">
                    <div class="card-header border-secondary fw-bold text-info d-flex justify-content-between align-items-center">
                        <span>🔭 Observatorio Paranal</span>
                        <small id="estado-paranal" class="text-muted">Actualizando...</small>
                    </div>
                    <div class="card-body text-center p-0" style="background-color: #000; border-radius: 0 0 6px 6px; overflow: hidden;">
                        <!-- La imagen ocupará todo el ancho disponible -->
                        <img id="camara-paranal" src="https://www.eso.org/public/archives/static/pano/latest/pano_PV_960x.jpg" alt="Panorámica Paranal" style="width: 100%; height: auto; display: block;">
                    </div>
                </div>

                <!-- Tarjeta 2: Sismos SENAPRED -->
                <div class="card bg-dark border-secondary mb-3 shadow">
                    <div class="card-header border-secondary fw-bold text-danger d-flex justify-content-between align-items-center">
                        <span>📉 Alertas Sísmicas</span>
                        <small id="estado-sismos" class="text-muted">Actualizando...</small>
                    </div>
                    <div class="card-body p-0">
                        <!-- Aquí se inyectará la lista de sismos mediante JavaScript -->
                        <ul id="lista-sismos" class="list-group list-group-flush rounded-bottom">
                            <li class="list-group-item bg-dark text-white text-center py-3">
                                <div class="spinner-border text-danger spinner-border-sm" role="status"></div>
                                <span class="ms-2">Cargando datos...</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Tarjeta 3: Clima local (Windy) -->
                <div class="card bg-dark border-secondary shadow">
                    <div class="card-header border-secondary fw-bold text-warning">
                        ⛅ Condiciones Meteorológicas
                    </div>
                    <div class="card-body p-0">
                        <!-- Contenedor responsivo para el mapa de Windy -->
                        <div style="width: 100%; height: 350px; border-radius: 0 0 6px 6px; overflow: hidden;">
                            <iframe 
                                width="100%" 
                                height="100%" 
                                src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km/h&zoom=10&overlay=wind&product=ecmwf&level=surface&lat=-25.405&lon=-70.483&detailLat=-25.405&detailLon=-70.483&marker=true&message=true" 
                                frameborder="0" 
                                title="Mapa Meteorológico Taltal">
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOTSTRAP 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.css"></script>
    <!-- SCRIPT DE SISMOLOGÍA DE CHILE -->
    <script>
        async function cargarSismos() {
            const urlSismos = 'https://api.gael.cloud/general/public/sismos';
            const contenedor = document.getElementById('lista-sismos');
            const estado = document.getElementById('estado-sismos');
            
            try {
                const respuesta = await fetch(urlSismos);
                const sismos = await respuesta.json();
                
                // Limpiar la lista de carga
                contenedor.innerHTML = '';
                
                // Tomar solo los últimos 3 sismos (puedes cambiar el 3 por el número que quieras)
                const ultimosSismos = sismos.slice(0, 3);
                
                ultimosSismos.forEach(sismo => {
                    // Configurar el color de la magnitud según su fuerza
                    const magnitud = parseFloat(sismo.Magnitud);
                    let colorMag = 'bg-secondary'; // Magnitud baja
                    if (magnitud >= 4.0 && magnitud < 5.0) colorMag = 'bg-warning text-dark'; // Media
                    if (magnitud >= 5.0) colorMag = 'bg-danger'; // Alta
                    
                    // Formatear la fecha (cortar los segundos para que se vea más limpio)
                    const fechaCorta = sismo.Fecha.substring(0, 16);
    
                    // Crear el elemento de la lista para cada sismo
                    const elemento = `
                        <li class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center">
                            <div class="ms-2 me-auto">
                                <div class="fw-bold" style="font-size: 0.9rem;">${sismo.RefGeografica}</div>
                                <small class="text-muted">${fechaCorta} • Prof: ${sismo.Profundidad} km</small>
                            </div>
                            <span class="badge ${colorMag} rounded-pill fs-6">${sismo.Magnitud}</span>
                        </li>
                    `;
                    contenedor.innerHTML += elemento;
                });
                
                // Actualizar el estado con la hora de carga
                const ahora = new Date();
                estado.innerText = `Actualizado: ${ahora.getHours().toString().padStart(2, '0')}:${ahora.getMinutes().toString().padStart(2, '0')}`;
                
            } catch (error) {
                console.error('Error al cargar sismos:', error);
                contenedor.innerHTML = `
                    <li class="list-group-item bg-dark text-danger text-center">
                        No se pudieron cargar los datos. Reintentando...
                    </li>
                `;
            }
        }
    
        // Cargar los sismos apenas se abra la página
        cargarSismos();
        
        // Configurar para que se actualice solo cada 5 minutos (300000 milisegundos)
        setInterval(cargarSismos, 300000);
    </script>
    
    <!-- SCRIPT CÁMARA PARANAL -->
    <script>
        function recargarCamaraParanal() {
            const imgElement = document.getElementById('camara-paranal');
            const estadoCamara = document.getElementById('estado-paranal');
            
            // La URL exacta que encontraste inspeccionando el código
            const baseUrl = 'https://www.eso.org/public/archives/static/pano/latest/pano_PV_960x.jpg';
            
            // Obtenemos el tiempo actual para engañar al caché
            const tiempo = new Date().getTime();
            
            // Le pegamos el tiempo al final de la URL (ej: ?t=170814... )
            imgElement.src = `${baseUrl}?t=${tiempo}`;
            
            // Actualizamos el reloj de revisión
            const ahora = new Date();
            estadoCamara.innerText = `Revisado: ${ahora.getHours().toString().padStart(2, '0')}:${ahora.getMinutes().toString().padStart(2, '0')}`;
        }
    
        // Ejecutar una vez al abrir la página
        recargarCamaraParanal();
        
        // Configurar para revisar si hay foto nueva cada 1 hora (3600000 milisegundos)
        setInterval(recargarCamaraParanal, 3600000);
    </script>
</body>
</html>
